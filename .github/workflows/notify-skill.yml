# Tells abhi245y/ola-dev-skill that an upstream changed, so it can re-sync and release.
#
# Copy this file to .github/workflows/notify-skill.yml in an upstream repo:
#   ola-dash-sdk:       EVENT_TYPE: sdk-updated, keep the SDK paths below, drop the CAN paths.
#   ola-can-reference:  EVENT_TYPE: can-updated, keep the CAN paths below, drop the SDK paths.
#
# Needs the secret SKILL_DISPATCH_TOKEN in the upstream repo: a fine-grained PAT owned by
# abhi245y, access to abhi245y/ola-dev-skill only, Repository permissions "Contents: Read
# and write". If the secret is empty, the job prints a notice and exits 0.

name: notify-skill

on:
  push:
    branches: [main]
    paths:
      - "contract/**"
      - "sdk/**"
      - "docs/**"
      - "themes/**"
      - "plugins/**"
      - "README.md"
  workflow_dispatch:

permissions: {}

env:
  EVENT_TYPE: sdk-updated
  SKILL_REPO: abhi245y/ola-dev-skill

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Send repository_dispatch to the skill repo
        env:
          TOKEN: ${{ secrets.SKILL_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::SKILL_DISPATCH_TOKEN is not set. Skipping the dispatch to $SKILL_REPO."
            exit 0
          fi
          body=$(printf '{"event_type":"%s","client_payload":{"repo":"%s","sha":"%s"}}' \
            "$EVENT_TYPE" "$GITHUB_REPOSITORY" "$GITHUB_SHA")
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$SKILL_REPO/dispatches" \
            -d "$body"
          echo "Sent $EVENT_TYPE to $SKILL_REPO."
