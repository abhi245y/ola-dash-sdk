[package]
name = "sim"
version = "0.1.0"
edition = "2021"
description = "Desktop mock-data runner for ola-dash themes"
license = "GPL-3.0-or-later"
publish = false

[[example]]
name = "unlock-preview"
path = "../host/test/unlock-preview.rs"

[dependencies]
# theme.json validation in --check.
serde_json = "1"
# Pinned: themes are checked against this exact Slint version.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "backend-winit"] }
slint-interpreter = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
# Headless PNG output for --screenshot.
png = "0.17"
# Drives the async compiler without a runtime.
pollster = "0.4"
